name: Run Datadog Synthetic tests

# Run on demand after the Datadog API and Application keys have been configured
# in GitHub Actions secrets. This is not a deployment workflow.
on:
  workflow_dispatch:

jobs:
  synthetics:
    runs-on: ubuntu-latest
    steps:
      - name: Check Datadog credentials
        id: datadog-secrets
        shell: bash
        run: |
          if [[ -n "$DD_API_KEY" && -n "$DD_APP_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}

      - name: Skip when Datadog credentials are not configured
        if: steps.datadog-secrets.outputs.configured != 'true'
        run: echo "Skipping Synthetic tests; configure DD_API_KEY and DD_APP_KEY to enable them."

      - name: Run Datadog Synthetic tests
        if: steps.datadog-secrets.outputs.configured == 'true'
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'
